name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-reader:
    name: TRUST reader (real sandbox)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install the pinned namespace-capable sandbox in the disposable runner
        env:
          BWRAP_COMMIT: 9ca3b05ec787acfb4b17bed37db5719fa777834f
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libcap-dev
          git init -q "$RUNNER_TEMP/bwrap"
          git -C "$RUNNER_TEMP/bwrap" fetch --depth 1 https://github.com/containers/bubblewrap "$BWRAP_COMMIT"
          git -C "$RUNNER_TEMP/bwrap" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/bwrap" rev-parse HEAD)" = "$BWRAP_COMMIT"
          meson setup "$RUNNER_TEMP/bwrap/build" "$RUNNER_TEMP/bwrap" -Dtests=false -Dman=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          ninja -C "$RUNNER_TEMP/bwrap/build" bwrap
          sudo install -m 0755 "$RUNNER_TEMP/bwrap/build/bwrap" /usr/bin/bwrap
          sudo install -m 0755 "$(command -v node)" /usr/bin/node
      - name: Check the actual reader namespace profile
        run: |
          uname -sr
          /usr/bin/bwrap --version
          for helper in newuidmap newgidmap; do command -v "$helper" || echo "$helper not installed"; done
          echo 'Delegated-UID fixture skipped on this runner; it requires the opted-in Arch device. The seven sandbox cases are required.'
          /usr/bin/bwrap --unshare-all --unshare-user --disable-userns --assert-userns-disabled --die-with-parent --new-session --cap-drop ALL --clearenv --ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 --remount-ro / -- /usr/bin/true
      - run: npm ci
      - run: npx vitest run tests/develop-verify-trust-003-reader.test.ts
        env:
          ENDO_REQUIRE_TRUST_SANDBOX: "1"
      - name: Reanalyse the guest archive from this shallow checkout alone
        run: |
          test "$(git rev-parse --is-shallow-repository)" = true
          if git cat-file -e 'c3718f1d20a0777742cb72d6a9dfd7a44ce938fa^{commit}' 2>/dev/null; then
            echo 'the staged commit is present, so this step would not show reanalysis without it'; exit 1
          fi
          D=research/develop-verify-trust-003
          node "$D/guest/reanalyze.ts" "$D/guest-run" "$RUNNER_TEMP/reanalysis.json"
          diff <(jq -S . "$D/guest-run/reanalysis/reanalysis.json") <(jq -S . "$RUNNER_TEMP/reanalysis.json")

  trust004-freeze:
    name: TRUST-004 operator freeze consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The selected source commit is kept reachable by its trust004-amendment-N tag, so a squash merge or rebase of the branch
      # cannot drop it from history; the test fails if that tag is missing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/develop-verify-trust-004-freeze.test.ts
        env:
          TRUST004_FREEZE_CHECK: "1"

  check:
    name: Typecheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Numerical probe offline tests and bounded cleanup regressions
        run: |
          python3 -m unittest discover -s research/numerical-execution-probe/tests -p 'test_*.py' -v
          c++ -std=c++17 -O2 research/numerical-execution-probe/tests/core_test.cpp -o "$RUNNER_TEMP/e4eg-core-test"
          "$RUNNER_TEMP/e4eg-core-test"

  # The suite takes 14-20 min in one job on these runners, at the edge of a 20-min limit that also covers setup (a passing run was
  # cancelled 0.1 s after vitest's summary). Vitest's --shard splits the test files into three parallel jobs, each well inside its own
  # limit, so the limit still catches a hang. Together the shards run every test file exactly once.
  test:
    name: Test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check sandbox tools (not kernel isolation coverage)
        run: |
          if ! test -x /usr/bin/python3 || ! test -x /usr/bin/bash; then
            echo '### Real kernel isolation coverage: ABSENT (python3 or bash missing)' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      # Ubuntu 24.04 ships GNU coreutils 9.4, whose mv has no --exchange: here the reference-replacement tests check the
      # up-front refusal, and the exchange job below checks the exchange itself.
      # ENDO_REQUIRE_BROWSER makes the Studio frontend's browser suite fail, not skip, on a runner without Chromium.
      - run: npm test -- --shard=${{ matrix.shard }}/3
        env:
          ENDO_REQUIRE_BROWSER: "1"

  package:
    name: Packaged CLI (build, pack, isolated install)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # The browser is part of the release gate: a runner without Chromium fails here instead of skipping the page's acceptance.
      - run: npm run test:package
        env:
          ENDO_REQUIRE_BROWSER: "1"

  package-floor:
    name: Packaged CLI on the supported Node floor (22.19.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json engines: ">=22.19.0". The `package` job runs the newest 22.x; this one builds, packs and installs on the lowest.
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:package
        env:
          ENDO_REQUIRE_BROWSER: "1"

  acceptance:
    name: Clean-install acceptance (real Pi, fake model endpoint)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The verified baseline (adapters/pi/version.ts). Bumping it is a deliberate act that needs its own evidence.
      PI_PINNED_VERSION: "1.0.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pi is installed here, by the CI job, as a user would; Endophasia never installs it.
      - name: Install the pinned Pi, separately from Endophasia
        run: |
          npm install --prefix "$RUNNER_TEMP/pi" --no-audit --no-fund "@earendil-works/pi-coding-agent@${PI_PINNED_VERSION}"
          echo "ENDO_ACCEPT_PI=$RUNNER_TEMP/pi/node_modules/.bin/pi" >> "$GITHUB_ENV"
          echo "ENDO_ACCEPT_PI_VERSION=${PI_PINNED_VERSION}" >> "$GITHUB_ENV"
      # Packs and installs the tarball in a scratch prefix, then runs doctor, check, attach, status, overview and
      # trajectory show from the installed bin, with an isolated HOME/XDG, the real Pi and a local fake OpenAI endpoint.
      - run: npm run test:acceptance
        env:
          ENDO_REQUIRE_BROWSER: "1"

  exchange:
    name: Reference exchange (coreutils with mv --exchange)
    runs-on: ubuntu-24.04
    container: fedora:42
    timeout-minutes: 20
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git-core tar xz gzip
      - name: Require mv --exchange
        run: |
          mv --version | head -n 1
          mv --help | grep -q -- '--exchange'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vitest --run tests/conformance-lab.test.ts tests/prime-097-conformance.test.ts tests/prime-097-review5.test.ts

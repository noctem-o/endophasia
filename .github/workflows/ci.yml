name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Numerical probe offline tests and bounded cleanup regressions
        run: |
          python3 -m unittest discover -s research/numerical-execution-probe/tests -p 'test_*.py' -v
          c++ -std=c++17 -O2 research/numerical-execution-probe/tests/core_test.cpp -o "$RUNNER_TEMP/e4eg-core-test"
          "$RUNNER_TEMP/e4eg-core-test"
      # Ubuntu 24.04 ships GNU coreutils 9.4, whose mv has no --exchange: here the reference-replacement tests check the
      # up-front refusal, and the exchange job below checks the exchange itself.
      # ENDO_REQUIRE_BROWSER makes the Studio frontend's browser suite fail, not skip, on a runner without Chromium.
      - run: npm test
        env:
          ENDO_REQUIRE_BROWSER: "1"

  package:
    name: Packaged CLI (build, pack, isolated install)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # The browser is part of the release gate: a runner without Chromium fails here instead of skipping the page's acceptance.
      - run: npm run test:package
        env:
          ENDO_REQUIRE_BROWSER: "1"

  package-floor:
    name: Packaged CLI on the supported Node floor (22.19.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json engines: ">=22.19.0". The `package` job runs the newest 22.x; this one builds, packs and installs on the lowest.
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:package
        env:
          ENDO_REQUIRE_BROWSER: "1"

  acceptance:
    name: Clean-install acceptance (real Pi, fake model endpoint)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The verified baseline (adapters/pi/version.ts). Bumping it is a deliberate act that needs its own evidence.
      PI_PINNED_VERSION: "1.0.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pi is installed here, by the CI job, as a user would; Endophasia never installs it.
      - name: Install the pinned Pi, separately from Endophasia
        run: |
          npm install --prefix "$RUNNER_TEMP/pi" --no-audit --no-fund "@earendil-works/pi-coding-agent@${PI_PINNED_VERSION}"
          echo "ENDO_ACCEPT_PI=$RUNNER_TEMP/pi/node_modules/.bin/pi" >> "$GITHUB_ENV"
          echo "ENDO_ACCEPT_PI_VERSION=${PI_PINNED_VERSION}" >> "$GITHUB_ENV"
      # Packs and installs the tarball in a scratch prefix, then runs doctor, check, attach, status, overview and
      # trajectory show from the installed bin, with an isolated HOME/XDG, the real Pi and a local fake OpenAI endpoint.
      - run: npm run test:acceptance
        env:
          ENDO_REQUIRE_BROWSER: "1"

  exchange:
    name: Reference exchange (coreutils with mv --exchange)
    runs-on: ubuntu-24.04
    container: fedora:42
    timeout-minutes: 20
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git-core tar xz gzip
      - name: Require mv --exchange
        run: |
          mv --version | head -n 1
          mv --help | grep -q -- '--exchange'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vitest --run tests/conformance-lab.test.ts tests/prime-097-conformance.test.ts tests/prime-097-review5.test.ts
